server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same origin for the SPA and the API: no CORS needed. Swagger UI (/docs) and the
    # OpenAPI schema are served through the same proxy.
    # X-Forwarded-For is OVERWRITTEN with the peer address (never appended), so a client
    # cannot inject a fake IP to dodge the per-IP rate limits.
    location ~ ^/(api/|docs|openapi\.json|health) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/login, /register, ...) all serve the SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
